
name: Android Release APK erstellen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Automatische Tests ausführen
        run: gradle testDebugUnitTest --no-daemon --info

      - name: Release prüfen und bauen
        run: gradle lintRelease assembleRelease bundleRelease --no-daemon --stacktrace --info

      - name: Release-Artefakte bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: DokumentenPilot-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
