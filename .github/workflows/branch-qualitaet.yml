name: DokumentenPilot Branch-Qualitaet

on:
  push:
    branches:
      - feature/familien-geraetetest
      - feature/familienbereich-test
      - feature/qualitaet-design-familienfreigabe
  pull_request:
    branches:
      - test/sprachauswahl
      - feature/qualitaet-design-familienfreigabe
      - test/android-backup-privacy-ci
      - fix/dokumentenanzeige-navigation
      - feature/bedienkomfort-assistenten
      - feature/startseite-assistenten-optimierung
      - feature/familienbereich-test
  workflow_dispatch:

concurrency:
  group: dokumentenpilot-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vorinstalliertes Android SDK pruefen
        run: test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests, Lint, Debug und Release bauen
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Vergleich der Manifest-Berechtigungen mit PR 8
        run: |
          git fetch --depth=1 origin f4e6ea9045e5771c4d0588128f0ba66f41a2fc0e
          git worktree add --detach "$RUNNER_TEMP/pr8" FETCH_HEAD
          gradle -p "$RUNNER_TEMP/pr8" :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon
          mkdir -p manifest-vergleich/pr8 manifest-vergleich/pr9
          cp "$RUNNER_TEMP/pr8"/app/build/outputs/logs/manifest-merger-*-report.txt manifest-vergleich/pr8/
          cp app/build/outputs/logs/manifest-merger-*-report.txt manifest-vergleich/pr9/
          for variant in debug release; do
            diff -u "manifest-vergleich/pr8/manifest-merger-$variant-report.txt" "manifest-vergleich/pr9/manifest-merger-$variant-report.txt" > "manifest-vergleich/$variant.diff" || test "$?" = 1
          done
      - name: Manifest-Vergleich aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-vergleich-pr8-pr9
          path: manifest-vergleich/
          if-no-files-found: warn
      - name: Test- und Lintberichte aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualitaetsberichte
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Unsigned APK und AAB bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dokumentenpilot-test-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
